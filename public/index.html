  function huidigBedrag() { return parseGeld(fBedrag.value, state.data.currency); }
  function formLeden() {
    const actief = leden();
    if (!state.bewerk || !state.data) return actief;
    const e = state.data.expenses.find((x) => x.id === state.bewerk);
    if (!e) return actief;
    const extra = [e.paidBy, ...e.shares.map((x) => x.memberId)]
      .filter((id, i, a) => a.indexOf(id) === i && !actief.some((m) => m.id === id))
      .map((id) => (state.data.removed || []).find((m) => m.id === id)).filter(Boolean);
    return actief.concat(extra.map((m) => ({ id: m.id, name: m.name, weg: true })));
  }
  let verdelingSleutel = '';
  function bouwVerdeling() {
    fVerdeling.textContent = '';
    fRest.classList.add('verborgen');
    verdelingSleutel = state.split + '|' + formLeden().map((m) => m.id).join(',');

      const st = fSel.get(m.id);

  // Wat elk lid gaat dragen (zelfde rekenregels als de server), plus restmelding bij exacte bedragen.
  function toonPreview() {
    const bedrag = huidigBedrag();
    const munt = state.data.currency;
    const wie = fWie.value;
    let verdeling = new Map();
    fRest.classList.add('verborgen'); fRest.classList.remove('fout');
    if (bedrag) {
      if (state.split === 'equal') {
        verdeling = verdeelGelijk(bedrag, leden().map((m) => m.id), wie);
      } else if (state.split === 'some') {
        const ids = formLeden().map((m) => m.id).filter((id) => (fSel.get(id) || {}).aan);
        if (ids.length) verdeling = verdeelGelijk(bedrag, ids, wie);
      } else if (state.split === 'exact') {
        let som = 0;
        for (const m of formLeden()) { const c = parseGeld((fSel.get(m.id) || {}).bedrag, munt) || 0; verdeling.set(m.id, c); som += c; }
        const rest = bedrag - som;
        if (rest !== 0) {
          fRest.textContent = rest > 0 ? t('expense.remaining', { amount: fmtGeld(rest, munt) }) : t('expense.over', { amount: fmtGeld(-rest, munt) });
          fRest.classList.remove('verborgen'); fRest.classList.add('fout');
        }
      } else if (state.split === 'shares') {
        const w = {};
        for (const m of formLeden()) { const n = parseDelen((fSel.get(m.id) || {}).delen); if (n > 0) w[m.id] = n; }
        if (Object.keys(w).length) verdeling = verdeelGewogen(bedrag, w, wie);
      }
    }
    // velden die niet te lezen zijn rood markeren
    for (const inp of fVerdeling.querySelectorAll('input[type="text"]')) {
      const st = fSel.get(inp.dataset.mid) || {};
      const leeg = !inp.value.trim();
      const ok = state.split === 'exact' ? (leeg || parseGeld(inp.value, munt) !== null) : (leeg || parseDelen(inp.value) !== null);
      inp.setAttribute('aria-invalid', ok ? 'false' : 'true');
    }
    for (const pv of fVerdeling.querySelectorAll('.deel-preview')) {
      const c = verdeling.get(pv.dataset.mid);
      pv.textContent = (state.split === 'exact' || c === undefined) ? '' : fmtGeld(c, munt);
    }
  }
  fBedrag.addEventListener('input', () => { fFout.classList.add('verborgen'); toonPreview(); });
  fWat.addEventListener('input', () => fFout.classList.add('verborgen'));
  fWie.addEventListener('change', () => { fWieGekozen = true; toonPreview(); });
  // betaler-lijst: jij standaard; een zelfgekozen betaler of (bij aanpassen) de bestaande blijft staan
  function vulWie() {
    if (document.activeElement === fWie) return;   // een open keuzelijst niet dichtklappen
    const oud = fWie.value;
    const lijst = formLeden();
    fWie.textContent = '';
    for (const m of lijst) {
      // naam geïsoleerd (U+2068/U+2069), zodat haakjes in RTL niet verspringen
      const naam = '\u2068' + m.name + '\u2069';
      const o = el('option', null, m.id === state.own ? naam + ' (' + t('you') + ')' : m.weg ? naam + ' · ' + t('balances.removed') : naam); o.value = m.id;
      fWie.append(o);
    }
    const heeft = (id) => lijst.some((m) => m.id === id);
    if ((fWieGekozen || state.bewerk) && oud && heeft(oud)) fWie.value = oud;
    else if (state.own && heeft(state.own)) fWie.value = state.own;
    else if (oud && heeft(oud)) fWie.value = oud;
  }

    else state.split = e.split;

    if (!fWat.value.trim()) { toon(t('err.description_required'), fWat); return; }
    if (gelezen.fout === 'large') { toon(t('err.amount_too_large'), fBedrag); return; }
    if (gelezen.fout === 'format' && fBedrag.value.trim()) { toon(t('err.amount_format', { example: geldNaarInvoer(decimalen(munt) === 0 ? 1250 : 1250 * Math.pow(10, decimalen(munt) - 2), munt) }), fBedrag); return; }
    if (!bedrag) { toon(t('err.invalid_amount'), fBedrag); return; }
    const body = { description: fWat.value, amount: bedrag, paidBy: fWie.value, date: fDatum.value };
    if (state.split === 'equal') { body.split = 'equal'; }
    else if (state.split === 'some') {
      body.split = 'equal';
      body.members = formLeden().map((m) => m.id).filter((id) => (fSel.get(id) || {}).aan);
      if (!body.members.length) { fFout.textContent = t('expense.pickOne'); fFout.classList.remove('verborgen'); return; }
    } else if (state.split === 'exact') {
      body.split = 'exact'; body.shares = {};
      let som = 0;
      for (const m of formLeden()) {
        const tekst = (fSel.get(m.id) || {}).bedrag || '';
        const c = tekst.trim() ? parseGeld(tekst, munt) : 0;
        if (c === null) { toon(t('err.invalid_split')); return; }
        if (c > 0) body.shares[m.id] = c; som += c;
      }
      if (som !== bedrag) { fFout.textContent = t('err.shares_mismatch'); fFout.classList.remove('verborgen'); return; }
    } else {
      body.split = 'shares'; body.weights = {};
      for (const m of formLeden()) {
        const tekst = (fSel.get(m.id) || {}).delen || '';
        const n = tekst.trim() ? parseDelen(tekst) : 0;
        if (n === null) { toon(t('err.invalid_split')); return; }
        if (n > 0) body.weights[m.id] = n;
      }
      if (!Object.keys(body.weights).length) { fFout.textContent = t('expense.pickOne'); fFout.classList.remove('verborgen'); return; }
    }
    fOk.disabled = true;
    const r = state.bewerk
      ? await api('/groups/' + groupId + '/expenses/' + state.bewerk, 'PUT', body)
      : await api('/groups/' + groupId + '/expenses', 'POST', body);
    fOk.disabled = false;
    if (r.ok) { formLeeg(); state.lastJson = ''; await haalOp(true); fWat.focus(); }
    else { fFout.textContent = foutTekst(r.data); fFout.classList.remove('verborgen'); }
  });
  fWat.addEventListener('keydown', (e) => { if (e.key === 'Enter') fBedrag.focus(); });
  fBedrag.addEventListener('keydown', (e) => { if (e.key === 'Enter') fOk.click(); });

  /* --- rekenwerk (identiek aan de server; alleen voor de preview) --- */
  function verdeelGelijk(amount, members, paidBy) {
    const n = members.length;
    const basis = Math.floor(amount / n);
    let rest = amount - basis * n;
    const out = new Map(members.map((m) => [m, basis]));
    const volgorde = members.includes(paidBy) ? [paidBy, ...members.filter((m) => m !== paidBy)] : members.slice();
    for (const m of volgorde) { if (rest <= 0) break; out.set(m, out.get(m) + 1); rest--; }
    return out;
  }
  function verdeelGewogen(amount, weights, paidBy) {
    const members = Object.keys(weights);
    const totaal = members.reduce((s, m) => s + weights[m], 0);
    const out = new Map(); let toegekend = 0;
    for (const m of members) { const deel = Math.floor((amount * weights[m]) / totaal); out.set(m, deel); toegekend += deel; }
    let rest = amount - toegekend;
    const volgorde = members.includes(paidBy) ? [paidBy, ...members.filter((m) => m !== paidBy)] : members.slice();
    for (const m of volgorde) { if (rest <= 0) break; out.set(m, out.get(m) + 1); rest--; }
    return out;
  }

      b.append(stip, bdi(m.name));
      if (m.id === state.own) b.append(el('span', null, '(' + t('you') + ')'));
      if (!state.own) b.addEventListener('click', async () => {
        zetIk(m.id, m.name);
        state.lastJson = ''; await haalOp(true);
      });
      wrap.append(b);
      if (state.own) {
        const x = el('button', 'chip-x'); x.type = 'button'; x.dataset.x = m.id;
        x.append(el('span', null, '×'));
        x.setAttribute('aria-label', t('members.remove', { name: m.name })); x.title = t('members.remove', { name: m.name });
        x.addEventListener('click', (e) => { e.stopPropagation(); state.wegVraag = m.id; state.focusNa = '.chipvraag .ja'; render(); });
        wrap.append(x);
      }
      chips.append(wrap);
      if (m.id === state.own) {
        const nietIk = el('button', 'nietik', t('members.notYou')); nietIk.type = 'button';
        nietIk.addEventListener('click', () => { zetIk(null); state.lastJson = ''; render(); naamIn.focus(); });
        chips.append(nietIk);
      }
    }
    const plus = el('button', 'chip toevoegen', '+ ' + t('members.add')); plus.type = 'button';
    plus.setAttribute('aria-expanded', state.nieuwOpen ? 'true' : 'false');
    plus.addEventListener('click', () => { state.nieuwOpen = !state.nieuwOpen; render(); if (state.nieuwOpen) nieuwIn.focus(); });
    chips.append(plus);
    nieuwRij.classList.toggle('verborgen', !state.nieuwOpen);
    nieuwIn.placeholder = t('members.add.ph'); nieuwOk.textContent = t('members.addBtn');

    weggehaaldLijn.textContent = '';
    const weg = d.removed || [];
    weggehaaldLijn.classList.toggle('verborgen', weg.length === 0);
    for (const w of weg) {
      const regel = el('span');
      regel.append(zin('members.removedInfo', { name: w.name, date: fmtDatum(String(w.deletedAt).slice(0, 10)) }), document.createTextNode(' '));
      weggehaaldLijn.append(regel);
    }

    bezoek.textContent = t('visits', { n: d.visits || 0 });
    bezoek.classList.remove('verborgen');

    const actief = document.activeElement;
    const focusMid = actief && chips.contains(actief) && actief.dataset ? actief.dataset.mid : null;
    const inVerdeling = fVerdeling.contains(actief);

    vulWie();
    splitKnoppen();
    const sleutel = state.split + '|' + formLeden().map((m) => m.id).join(',');
    if (sleutel !== verdelingSleutel && !inVerdeling) bouwVerdeling(); else toonPreview();
    hertaalForm();
    // saldi alleen opnieuw opbouwen als ze echt veranderden (schermlezers lezen dit blok voor)
    const saldiSleutel = state.lang + '|' + state.own + '|' + JSON.stringify([d.balances, d.transfers, d.expenses.length, d.settlements.length, d.removed]);
    if (saldiSleutel !== state.saldiSleutel) { state.saldiSleutel = saldiSleutel; bouwSaldi(); }
    bouwLijst();

    if (state.focusNa) {
      const doel = scherm.querySelector(state.focusNa);
      state.focusNa = null;
      if (doel) doel.focus({ preventScroll: true });
    } else if (focusMid) {
      const terug = chips.querySelector('.chip[data-mid="' + focusMid + '"]');
      if (terug) terug.focus({ preventScroll: true });
    }
  }

  function schermOnbekend() {
    clearInterval(verversTimer);
    recentVergeet(groupId);
    scherm.textContent = '';
    const kop = el('h1', null, t('notfound.title'));
    const tekst = el('p', null, t('notfound.text'));
    const knop = el('button', null, t('notfound.new')); knop.type = 'button';
    knop.addEventListener('click', () => { location.href = '/'; });
    scherm.append(kop, tekst, knop);
    hertaal = () => { kop.textContent = t('notfound.title'); tekst.textContent = t('notfound.text'); knop.textContent = t('notfound.new'); };
  }

  let volgnr = 0, toegepast = 0, gestopt = false;
  async function haalOp(forceer) {
    if (gestopt) return;
    const nr = ++volgnr;
    const teller = schrijfTeller;
    let res, tekst, data;
    try {
      res = await fetch('/api/groups/' + groupId, { cache: 'no-store' });
      tekst = await res.text();
    } catch {
      toonFout(navigator.onLine === false ? 'err.offline' : 'err.server');
      return;
    }
    if (res.status === 404) { gestopt = true; schermOnbekend(); return; }
    if (!res.ok) { toonFout('err.server'); return; }
    try { data = JSON.parse(tekst); } catch { toonFout('err.server'); return; }
    verbergFout();
    // een antwoord dat ouder is dan wat al getoond wordt, of dat vertrok vóór of tijdens een
    // schrijfactie, zou nieuwe gegevens overschrijven (bv. een al betaalde schuld terugzetten)
    if (nr < toegepast) return;
    if (!forceer && teller !== schrijfTeller) return;
    if (tekst === state.lastJson) return;
    toegepast = nr;
    state.lastJson = tekst;
    state.data = data;
    recentBewaar(groupId, state.data.title);
    if (state.own && !state.data.members.some((m) => m.id === state.own)) zetIk(null);
    render();
  }
  hertaal = render;

  async function telBezoek() {
    try {
      if (localStorage.getItem(LS.visited(groupId))) return;
      localStorage.setItem(LS.visited(groupId), '1');
    } catch {}
    await api('/groups/' + groupId + '/visit', 'POST'); state.lastJson = ''; await haalOp(true);
  }
  haalOp(true).then(telBezoek);
  const verversTimer = setInterval(() => { if (!document.hidden) haalOp(false); }, 10000);
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') haalOp(false); });
}

/* ---------- route ---------- */
const pad = location.pathname.replace(/\/+$/, '');
if (pad.startsWith('/g/') && pad.length > 3) schermGroep(pad.slice(3));
else schermMaken();

/* ---------- PWA: service worker, installeren, update-check ---------- */
(function pwa() {
  const isLocal = ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  if ('serviceWorker' in navigator && !isLocal) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}); });
  }
  const updateBar = document.getElementById('updateBar');
  const updateTekst = document.getElementById('updateTekst');
  const updateBtn = document.getElementById('updateBtn');
  function toonUpdate() { updateTekst.textContent = t('update.text'); updateBtn.textContent = t('update.button'); updateBar.classList.remove('verborgen'); }
  async function checkUpdate() {
    try {
      const res = await fetch('/api/version', { cache: 'no-store' });
      if (!res.ok) return;
      const d = await res.json();
      if (d && d.version && d.version !== VERSIE) toonUpdate();
    } catch {}
  }
  updateBtn.addEventListener('click', async () => {
    updateBtn.disabled = true;
    try {
      if ('serviceWorker' in navigator) { const regs = await navigator.serviceWorker.getRegistrations(); await Promise.all(regs.map((r) => r.unregister())); }
      if (window.caches) { const keys = await caches.keys(); await Promise.all(keys.map((k) => caches.delete(k))); }
    } catch {}
    location.reload();
  });
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });

  const installBar = document.getElementById('installBar');
  const installTekst = document.getElementById('installTekst');
  const installBtn = document.getElementById('installBtn');
  const installSluit = document.getElementById('installSluit');
  const mobiel = /android|iphone|ipad|ipod|mobile|silk|kindle/i.test(navigator.userAgent);
  const staat = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const alGesloten = () => { try { return localStorage.getItem('evenly.install.dismiss') === '1'; } catch { return false; } };
  let deferred = null; let verbergTimer = null;
  function toonInstall(metKnop) {
    if (!mobiel || staat || alGesloten()) return;
    installTekst.textContent = metKnop ? t('install.text') : t('install.ios');
    installBtn.classList.toggle('verborgen', !metKnop);
    if (metKnop) installBtn.textContent = t('install.button');
    installBar.classList.remove('verborgen');
    clearTimeout(verbergTimer);
    verbergTimer = setTimeout(() => installBar.classList.add('verborgen'), 10000);
  }
  function verbergInstall(onthoud) {
    clearTimeout(verbergTimer); installBar.classList.add('verborgen');
    if (onthoud) { try { localStorage.setItem('evenly.install.dismiss', '1'); } catch {} }
  }
  installSluit.addEventListener('click', () => verbergInstall(true));
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; toonInstall(true); });
  installBtn.addEventListener('click', async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch {}
    deferred = null; verbergInstall(false);
  });
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isSafari = /^((?!chrome|crios|fxios|android).)*safari/i.test(navigator.userAgent);
  if (isIOS && isSafari) toonInstall(false);
})();
</script>
